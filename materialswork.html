<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* =========================
   DAT GUI MAIN
========================= */
.dg.main {
    width: 290px !important;
    font-family: Arial, sans-serif !important;
    font-size: 12px !important;
}

/* กล่องหลัก */
.dg.main > ul {
    background: rgba(8, 14, 24, 0.94) !important;
    border: 1px solid rgba(80, 190, 255, 0.45) !important;
    border-radius: 12px !important;
    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.55),
        0 0 20px rgba(0, 170, 255, 0.08);
    overflow: hidden;
}

/* =========================
   FOLDER TITLE
========================= */
.dg .folder .title {
    background: linear-gradient(
        90deg,
        #101d30,
        #162d46
    ) !important;

    color: #8ee8ff !important;

    font-size: 13px !important;
    font-weight: bold !important;

    height: 38px !important;
    line-height: 38px !important;

    padding-left: 15px !important;

    border-bottom: 1px solid rgba(80, 190, 255, 0.25) !important;

    letter-spacing: 0.5px;
}

/* ลูกศร folder */
.dg .folder .title::before {
    color: #5fdcff !important;
}

/* hover folder */
.dg .folder .title:hover {
    background: linear-gradient(
        90deg,
        #142b43,
        #1d3d5d
    ) !important;
}

/* =========================
   ROW
========================= */
.dg .cr {
    background: #0d1724 !important;

    height: 34px !important;
    line-height: 34px !important;

    border-bottom: 1px solid rgba(255,255,255,0.05) !important;
}

/* hover */
.dg .cr:hover {
    background: #132337 !important;
}

/* =========================
   PROPERTY NAME
========================= */
.dg .property-name {
    color: #d5e9f5 !important;
    font-weight: normal !important;
}

/* =========================
   SLIDER
========================= */
.dg .c .slider {
    background: #26384b !important;
    border-radius: 5px !important;
    height: 8px !important;
    margin-top: 13px !important;
}

/* slider ที่เลือก */
.dg .c .slider-fg {
    background: linear-gradient(
        90deg,
        #00a8ff,
        #54e6ff
    ) !important;

    border-radius: 5px !important;
}

/* =========================
   NUMBER INPUT
========================= */
.dg input[type="text"] {
    background: #08111c !important;

    color: #8ee8ff !important;

    border: 1px solid #29465e !important;

    border-radius: 5px !important;

    text-align: center !important;

    height: 20px !important;

    box-sizing: border-box;
}

/* focus */
.dg input[type="text"]:focus {
    border-color: #43d9ff !important;

    outline: none !important;

    box-shadow: 0 0 8px rgba(67, 217, 255, 0.25);
}

/* =========================
   COLOR PICKER
========================= */
.dg .color {
    border: 1px solid #31536d !important;
    border-radius: 5px !important;
}

/* =========================
   CLOSE BUTTON
========================= */
.dg .close-button {
    width: 290px !important;

    height: 34px !important;
    line-height: 34px !important;

    background: #07101a !important;

    color: #6edfff !important;

    border-top: 1px solid rgba(80, 190, 255, 0.25) !important;

    font-size: 11px !important;

    font-weight: bold !important;

    letter-spacing: 1px;

    border-radius: 0 0 10px 10px;
}

.dg .close-button:hover {
    background: #10283c !important;
    color: white !important;
}

/* =========================
   LIGHT FOLDER
========================= */

/* แถว Light ให้มีเส้นฟ้า */
.dg .folder:first-child .title {
    border-left: 4px solid #00c8ff !important;
}

/* =========================
   PBR FOLDER
========================= */

.dg .folder:nth-child(2) .title {
    border-left: 4px solid #b86cff !important;
}

/* =========================
   SCROLLBAR
========================= */

.dg ::-webkit-scrollbar {
    width: 5px;
}

.dg ::-webkit-scrollbar-track {
    background: #07101a;
}

.dg ::-webkit-scrollbar-thumb {
    background: #28516b;
    border-radius: 10px;
}

.dg ::-webkit-scrollbar-thumb:hover {
    background: #3d789b;
}
</style>
</style>
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const gui = new dat.GUI();

        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const abmientLight = new THREE.AmbientLight(0x404040, 1); // soft white light
        scene.add(abmientLight);

        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const lightSettings = {
            x: 10,
            y: 10,
            z: 10,
            intensity: 0.5
};

        const lightFolder = gui.addFolder('Light');

            lightFolder.add(lightSettings, 'x', -20, 20, 0.1)
                .name('Light X')
                .onChange((value) => {
                    directionalLight.position.x = value;
});

            lightFolder.add(lightSettings, 'y', 0, 20, 0.1)
                .name('Light Y')
                .onChange((value) => {
                    directionalLight.position.y = value;
});

            lightFolder.add(lightSettings, 'z', -20, 20, 0.1)
                .name('Light Z')
                .onChange((value) => {
                    directionalLight.position.z = value;
});

            lightFolder.add(lightSettings, 'intensity', 0, 3, 0.1)
                .name('Intensity')
                .onChange((value) => {
                    directionalLight.intensity = value;
});

lightFolder.open();


        
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/construction_yard_4k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;
                

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });



        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://noppawin2006.github.io/My-Sprite/gravel_concrete_diff_4k.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide,
            metalness: 0.1,
            roughness: 0.8
});
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        
        scene.add(plane);


        //load glb และใช้ pbr material
        const loader = new THREE.GLTFLoader();
        let model;
        let pbrMaterials = [];

        loader.load('https://noppawin2006.github.io/My-Sprite/buzz_lightyear_toy_story_v2_kh3.glb', (gltf) => {

        model = gltf.scene;

        model.traverse((child) => {

        if (child.isMesh) {

            child.castShadow = true;
            child.receiveShadow = true;

            // ตรวจสอบ Material
            if (child.material) {

                // ถ้าเป็น PBR Material อยู่แล้ว
                if (child.material.isMeshStandardMaterial ||
                    child.material.isMeshPhysicalMaterial) {

                    pbrMaterials.push(child.material);
                    child.material.metalness = 0.8;
                    child.material.roughness = 0.2;

                }
            }
        }

    });

    model.position.set(0, 0, 0);
    scene.add(model);

});        
    


        const pbrSettings = {
            baseColor: '#ffffff',
            metallic: 0.5,
            roughness: 0.5
};

        const pbrFolder = gui.addFolder('PBR Material');

        pbrFolder.addColor(pbrSettings, 'baseColor')
            .name('Base Color')
            .onChange((value) => {

                pbrMaterials.forEach((material) => {
                    material.color.set(value);
        });

    });

        pbrFolder.add(pbrSettings, 'metallic', 0, 1, 0.01)
            .name('Metallic')
            .onChange((value) => {

                pbrMaterials.forEach((material) => {
                    material.metalness = value;
        });

    });

        pbrFolder.add(pbrSettings, 'roughness', 0, 1, 0.01)
            .name('Roughness')
            .onChange((value) => {

                pbrMaterials.forEach((material) => {
                    material.roughness = value;
        });

    });

        pbrFolder.open();
        //กรวย
        loader.load('https://noppawin2006.github.io/My-Sprite/traffic_cone_3d_model__pbr_textured.glb', (gltf) => {

        const coneModel = gltf.scene;

        const positions = [
            [1.5, 0, 1.0],    // หน้า ขวา
            [-1.5, 0, 1.0],   // หน้า ซ้าย
            [1.5, 0, -1.0],   // หลัง ขวา
            [-1.5, 0, -1.0]   // หลัง ซ้าย
        ];

        positions.forEach((pos) => {

            const cone = coneModel.clone();

            cone.position.set(pos[0], pos[1], pos[2]);
            cone.scale.set(1, 1, 1);

            cone.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(cone);
        });

    },
    undefined,
    (error) => {
        console.error('Unable to load cone:', error);
    }
);

        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);

        // ลูกที่ 1 สีเขียว
        const sphereMaterial1 = new THREE.MeshStandardMaterial({
            color: 0x00ff00,
            metalness: 1.0,
            roughness: 0.2
});

        const sphere1 = new THREE.Mesh(sphereGeometry, sphereMaterial1);
            sphere1.position.set(-1.5, 0.5,-0.5);
            sphere1.castShadow = true;
            sphere1.receiveShadow = true;
            scene.add(sphere1);


        // ลูกที่ 2 สีแดง
        const sphereMaterial2 = new THREE.MeshStandardMaterial({
        color: 0xff0000,
        metalness: 0.2,
        roughness: 1.0
});

        const sphere2 = new THREE.Mesh(sphereGeometry, sphereMaterial2);
            sphere2.position.set(1.5, 0.5, -0.5);
            sphere2.castShadow = true;
            sphere2.receiveShadow = true;
            scene.add(sphere2); 

        

        
      



        
        function animate(t) {
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>
</body>

</html>
