<html>
<head>
    <title>Raster Graphics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<canvas id="canvas" width="200" height="200"></canvas>

<div class="toolbar">
    <button onclick="tool='pencil'">✏️</button>
    <button onclick="tool='eraser'">🧹</button>
    <button onclick="tool='line'">เส้น</button>
    <button onclick="tool='rect'">▭</button>
    <button onclick="tool='ellipse'">⬭</button>
    <input type="color" id="colorPicker" value="#000000">
    <input type="range" id="brushSize" min="1" max="20" value="1">
    <span id="brushValue">1</span>
</div class="toolbar">

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const pixels = imageData.data; // Array of color [R,G,B,A, R,G,B,A, ...]

function putPixel(x, y, r, g, b, a = 255) {
  const idx = (y * canvas.width + x) * 4; // หา index แรกของ pixel (x,y)
  pixels[idx] = r;
  pixels[idx + 1] = g;
  pixels[idx + 2] = b;
  pixels[idx + 3] = a;
}

function drawBrush(x, y, size, r, g, b, a = 255) {
    const half = Math.floor(size / 2);

    for (let yy = -half; yy <= half; yy++) {
        for (let xx = -half; xx <= half; xx++) {
            putPixel(x + xx, y + yy, r, g, b, a);
        }
    }

}

function drawBrushLine(x1, y1, x2, y2, size, r, g, b, a = 255) {

    const dx = Math.abs(x2 - x1);
    const dy = Math.abs(y2 - y1);

    if (dx === 0 && dy === 0) {
        drawBrush(x1, y1, size, r, g, b, a);
        return;
    }

    if (dx > dy) {

        const m = (y2 - y1) / (x2 - x1);
        const c = y1 - m * x1;

        for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
            const y = Math.round(m * x + c);
            drawBrush(x, y, size, r, g, b, a);
        }

    } else {

        const m = (x2 - x1) / (y2 - y1);
        const c = x1 - m * y1;

        for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
            const x = Math.round(m * y + c);
            drawBrush(x, y, size, r, g, b, a);
        }

    }

}

function drawLine(x1, y1, x2, y2,r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawRect(x1, y1, x2, y2, size, r, g, b, a = 255) {

    const w = Math.abs(x2 - x1);
    const h = Math.abs(y2 - y1);

    const maxSize = Math.max(1, Math.floor(Math.min(w, h) / 2));
    const s = Math.min(size, maxSize);

    drawBrushLine(x1, y1, x2, y1, s, r, g, b, a);
    drawBrushLine(x2, y1, x2, y2, s, r, g, b, a);
    drawBrushLine(x2, y2, x1, y2, s, r, g, b, a);
    drawBrushLine(x1, y2, x1, y1, s, r, g, b, a);
}

function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
  for (let y = y1; y <= y2; y++) {
    for (let x = x1; x <= x2; x++) {
      putPixel(x, y, r, g, b, a);
    }
  }
}



function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255) {
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
        putPixel(cx + x, cy + y, r, g, b, a);
      }
    }
  }
}

function drawSprite(sprite, x, y, r, g, b, a = 255) {
  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      if (sprite[j][i] === 1) {
        putPixel(x + i, y + j, r, g, b, a);
      }
    }
  }
}
const eraserSize = 12; // ขนาดสี่เหลี่ยมยางลบ (ปรับตัวเลขนี้เพื่อเปลี่ยนขนาดได้)

function eraseSquare(cx, cy, size) {
  const half = Math.floor(size / 2);
  drawRectFilled(cx - half, cy - half, cx + half, cy + half, 255, 255, 255);
}
function eraseLine(x1, y1, x2, y2, size) {// เดินตามเส้นจากจุดเก่าไปจุดใหม่ แล้วปั๊มสี่เหลี่ยมทับทุกจุด กันเป็นรอยขาดตอนลากเร็ว
  
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);



  if (dx === 0 && dy === 0) {
    eraseSquare(x1, y1, size);
    return;
  }

  if (dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      eraseSquare(x, y, size);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      eraseSquare(x, y, size);
    }
  }
}



function toScaledMousePos(posX, posY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.floor((posX - rect.left) * scaleX),
    y: Math.floor((posY - rect.top) * scaleY)
  };
}


let isDragging = false; 
let previousX = 0;
let previousY = 0;
let startX = 0;
let startY = 0;
let r = 0, g = 0, b = 0, a = 255; // Default color
let tool = null;
let brushSize = 1;
let snapshot = null; // เก็บสำเนา pixel data ไว้ตอนเริ่มลากเส้น เพื่อใช้ทำ preview

const brushSlider = document.getElementById("brushSize");
const brushValue = document.getElementById("brushValue");

brushSlider.addEventListener("input", () => {
    brushSize = parseInt(brushSlider.value);
    brushValue.textContent = brushSize;
});

document.getElementById("colorPicker").addEventListener("input", (event) => {
    const hex = event.target.value;

    r = parseInt(hex.substring(1, 3), 16);
    g = parseInt(hex.substring(3, 5), 16);
    b = parseInt(hex.substring(5, 7), 16);
});

canvas.addEventListener('click', (event) => {

});

canvas.addEventListener('mousedown', (event) => {

    if (tool !== 'pencil' && tool !== 'eraser' && tool !== 'line' && tool !== 'rect'&& tool !== 'ellipse')
        return;

    const { x, y } = toScaledMousePos(event.clientX, event.clientY);

    startX = x;
    startY = y;

    previousX = x;
    previousY = y;
    
    isDragging = true;

    if (tool === 'line' || tool === 'rect'||tool == 'ellipse') {
        snapshot = pixels.slice(); // ถ่ายสำเนา pixel ปัจจุบันเก็บไว้ก่อนเริ่มลาก
    }
});

canvas.addEventListener('mouseup', (event) => {

    if (!isDragging) return;

    const { x, y } = toScaledMousePos(event.clientX, event.clientY);

    if (tool === "line") {

        pixels.set(snapshot); // คืนค่า pixel เดิมก่อน (ลบ preview เก่าทิ้ง)
        drawBrushLine(startX, startY, x, y, brushSize, r, g, b);
        ctx.putImageData(imageData, 0, 0);

        snapshot = null;

    }
    if (tool === "rect") {

        pixels.set(snapshot); // คืนค่า pixel เดิมก่อน (ลบ preview เก่าทิ้ง)
        drawRect(startX, startY,x, y,brushSize,r, g, b); // วาดกรอบสี่เหลี่ยมจริงเป็นครั้งสุดท้าย
        ctx.putImageData(imageData, 0, 0);

        snapshot = null;

    }
    if (tool === "ellipse") {

        pixels.set(snapshot); // คืนค่า pixel เดิมก่อน (ลบ preview เก่าทิ้ง)

        const cx = Math.round((startX + x) / 2);
        const cy = Math.round((startY + y) / 2);
        const rx = Math.round(Math.abs(x - startX) / 2);
        const ry = Math.round(Math.abs(y - startY) / 2);

        drawEllipse(cx, cy, rx, ry, r, g, b); // วาดวงรีจริงเป็นครั้งสุดท้าย
        ctx.putImageData(imageData, 0, 0);

        snapshot = null;

    }
    isDragging = false;
});

canvas.addEventListener('mousemove', (event) => {
  if (tool !== 'pencil' && tool !== 'eraser' && tool !== 'line' && tool !== 'rect'&& tool !== 'ellipse')
     return;
 
  const { x, y } = toScaledMousePos(event.clientX, event.clientY);

 if(isDragging){

    if(tool === "pencil"){

        drawBrushLine(previousX, previousY, x, y, brushSize, r, g, b);

    }
    else if(tool === "eraser"){

        eraseLine(previousX, previousY, x, y, eraserSize);

    }
    else if(tool === "line"){

        pixels.set(snapshot);           // คืนค่า pixel เดิม (ลบเส้น preview เฟรมก่อนหน้าทิ้ง)
        drawBrushLine(startX, startY, x, y, brushSize, r, g, b); // วาดเส้น preview ทับลงไปใหม่
        ctx.putImageData(imageData, 0, 0);

    }
    else if(tool === "rect"){

        pixels.set(snapshot); // คืนค่า pixel เดิม (ลบกรอบ preview เฟรมก่อนหน้าทิ้ง)
        drawRect(startX, startY, x, y,brushSize,r, g, b);     // วาดกรอบ preview ทับลงไปใหม่ตามตำแหน่งเมาส์ปัจจุบัน
        ctx.putImageData(imageData, 0, 0);

    }
    else if(tool === "ellipse"){

        pixels.set(snapshot); // คืนค่า pixel เดิม (ลบวงรี preview เฟรมก่อนหน้าทิ้ง)

        const cx = Math.round((startX + x) / 2);
        const cy = Math.round((startY + y) / 2);
        const rx = Math.round(Math.abs(x - startX) / 2);
        const ry = Math.round(Math.abs(y - startY) / 2);

        drawEllipse(cx, cy, rx, ry, r, g, b); // วาดวงรี preview ทับลงไปใหม่
        ctx.putImageData(imageData, 0, 0);

    }

    ctx.putImageData(imageData,0,0);
}
  previousX = x;
  previousY = y;
});





ctx.putImageData(imageData, 0, 0);

</script>
</body>

</html>
