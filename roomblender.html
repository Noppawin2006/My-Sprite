<!DOCTYPE html>
<html>

<head>
    <title>living_room</title>
</head>
<style>
        /* สไตล์สำหรับปุ่ม Back */
        #backBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #ffffff;
            color: #333333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: none; /* ซ่อนปุ่มไว้ก่อนเริ่มต้น */
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s;
        }
        #backBtn:hover {
            background-color: #e0e0e0;
        }
    </style>
<body>
    <!-- ปุ่มย้อนกลับที่เพิ่มเข้ามาใน Body -->
    <button id="backBtn">⬅ ย้อนกลับ</button>
<video
    id="projectVideo"
    autoplay
    loop
    muted
    playsinline
    crossorigin="anonymous"
    style="display:none;">
    <source
        src="https://noppawin2006.github.io/My-Sprite/Project.mp4"
        type="video/mp4">
</video>
</div>
    <!-- Core Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- CDN Meshopt Decoder -->
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>

    <script>
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.outputEncoding = THREE.sRGBEncoding;
                
                // 1. เปิดใช้งานการคำนวณเงา (Shadow Map)
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                
                document.body.appendChild(renderer.domElement);

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x222222);

                const camera = new THREE.PerspectiveCamera(
                    45,
                    window.innerWidth / window.innerHeight,
                    0.01,
                    10000
                );
                camera.position.set(0, 0, 10);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);

                
                //AmbientLight
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                scene.add(ambientLight);

                // แสงหลักสร้างเงา (Directional Light)
                const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
                dirLight1.position.set(5, 12, 8);
                dirLight1.castShadow = true; // ให้แสงส่งเงา
                dirLight1.shadow.mapSize.width = 2048; // ความละเอียดเงา
                dirLight1.shadow.mapSize.height = 2048;
                scene.add(dirLight1);

                // แสงส่องซัพพอร์ตมุมมืด (Fill Light)
                const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
                fillLight.position.set(-5, 5, -5);
                scene.add(fillLight);

                const shaderLeaves = [];

                // Picking
                const pickables = [];
                const raycaster = new THREE.Raycaster();
                const pointer = new THREE.Vector2();

                let tvMesh;
                let lampLight;
                let lampOn = false;
                let lampMesh;
                let originalLampColor;

                //  ตัวแปรสำหรับควบคุมการเคลื่อนที่กล้องไปยังวัตถุ 
                let targetLookAt = new THREE.Vector3(0, 0, 0);
                let targetCamPos = null;
                let photoMesh; // ตัวแปรเก็บอ้างอิง Plane016

                // ตัวแปรสำหรับเก็บตำแหน่งกล้องเดิมก่อนซูมๆ
                let isZoomed = false;
                const originalCamPos = new THREE.Vector3();
                const originalCamTarget = new THREE.Vector3();
                const zoomCamPos = new THREE.Vector3();
                const zoomCamTarget = new THREE.Vector3();

                
                MeshoptDecoder.ready.then(() => {
                    const gltfLoader = new THREE.GLTFLoader();
                    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

                    const glbUrl = 'https://noppawin2006.github.io/My-Sprite/room3.glb';

                    gltfLoader.load(
                        glbUrl,
                        (gltf) => {
                            const model = gltf.scene;

                        
                        model.traverse((child) => {

            if (child.isMesh) {

                child.castShadow = true;
                child.receiveShadow = true;
                // เพิ่มโคมไฟให้สามารถคลิกได้
            if (child.name === "Cylinder004") {
                pickables.push(child);
                lampMesh = child;

                // แยก Material ของโคมออกจากวัตถุอื่น
                lampMesh.material = lampMesh.material.clone();

                if (lampMesh.material && lampMesh.material.color) {
                    originalLampColor = lampMesh.material.color.clone();
                }
            }
                    if (child.name === "Plane016") {
                    pickables.push(child);
                    photoMesh = child;
                }

                    if (child.name === "Plane018") {

                    pickables.push(child);
                    tvMesh = child;

                    const video = document.getElementById("projectVideo");

                    video.addEventListener("error", () => {
                        console.error("VIDEO ERROR:", video.error);
                    });

                    const videoTexture = new THREE.VideoTexture(video);

                    videoTexture.encoding = THREE.sRGBEncoding;
                    videoTexture.minFilter = THREE.LinearFilter;
                    videoTexture.magFilter = THREE.LinearFilter;
                    videoTexture.flipY = false;

                    child.material = new THREE.MeshBasicMaterial({
                        map: videoTexture,
                        side: THREE.DoubleSide
                    });

                    video.play().catch((error) => {
                        console.error("Video play error:", error);
                    });
                }

                if (child.material) {

                    child.material.needsUpdate = true;

                    if (child.material.map) {
                        child.material.map.encoding = THREE.sRGBEncoding;
                    }

            
                // Vertex Shader ใบไม้
                if (
                    child.name === "Plane008" ||
                    child.name === "Plane009" ||
                    child.name === "Plane010" ||
                    child.name === "Plane014" ||
                    child.name === "Plane012" ||
                    child.name === "Plane015" ||
                    child.name === "Plane013" ||
                    child.name === "Plane011" 
                ) {

                const oldMaterial = child.material;

                const uniforms = {
                    uTime: { value: 0.0 },
                    uColor: { value: oldMaterial.color.clone() }
                };

                    console.log("==========");
                    console.log("NAME:", child.name);
                    console.log("MATERIAL:", oldMaterial);
                    console.log("MAP:", oldMaterial.map);
                    console.log("ALPHA MAP:", oldMaterial.alphaMap);
                    console.log("COLOR:", oldMaterial.color);
                    console.log("TYPE:", oldMaterial.type);

                const vertexShader = `
                    uniform float uTime;

                    varying vec2 vUv;
                    varying vec3 vNormal;

                    void main() {

                        vUv = uv;

                        vec3 pos = position;

                        // Vertex Shader เดิม → ใบไม้ขยับ
                        pos.z += sin(pos.x * 3.0 + uTime * 4.0) * 1.2;

                        // ส่ง Normal ไปให้ Fragment Shader
                        vNormal = normalize(normalMatrix * normal);

                        gl_Position =
                            projectionMatrix *
                            modelViewMatrix *
                            vec4(pos, 1.0);
                    }
                `;

                const fragmentShader = `
                    precision mediump float;

                    uniform vec3 uColor;
                    varying vec2 vUv;
                    varying vec3 vNormal;

                    void main() {

                        vec3 normal = normalize(vNormal);

                        vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));

                        float light = max(dot(normal, lightDir), 0.0);

                        // Cel Shading
                        float toonLight;

                        if (light > 0.7) {
                            toonLight = 1.0;
                        } else if (light > 0.35) {
                            toonLight = 0.65;
                        } else {
                            toonLight = 0.35;
                        }

                        vec3 finalColor = uColor * toonLight;

                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `;

                child.material = new THREE.ShaderMaterial({

                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader,

                    uniforms: uniforms,

                    side: THREE.DoubleSide

                });

                shaderLeaves.push(uniforms);
            }
        }
    }
});
                    scene.add(model);
                    // ไฟของโคมไฟ
                    lampLight = new THREE.PointLight(0xffffcc, 0, 8);
                    lampLight.castShadow = true;

                    scene.add(lampLight);

                    // Center model within view
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    model.position.x += (model.position.x - center.x);
                    model.position.y += (model.position.y - center.y);
                    model.position.z += (model.position.z - center.z);
                    const lamp = model.getObjectByName("Cylinder004");

                    if (lamp) {
                        const lampPosition = new THREE.Vector3();
                        lamp.getWorldPosition(lampPosition);
                        lampLight.position.copy(lampPosition);
                    }

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraZ *= 1.3;

                    camera.position.set(0, maxDim / 2, cameraZ);
                    camera.lookAt(0, 0, 0);

                    controls.target.set(0, 0, 0);
                    controls.update();
                },
            );
        });
            function animate(time) {
                requestAnimationFrame(animate);

                // อัปเดตเวลาให้ Vertex Shader ใบไม้ 
                shaderLeaves.forEach((uniforms) => {
                    uniforms.uTime.value = time * 0.001;
                });

                // ทำให้กล้องสไลด์ (Lerp) ไปยังเป้าหมายอย่างนุ่มนวล ---
                if (targetCamPos) {
                    camera.position.lerp(targetCamPos, 0.05);
                    controls.target.lerp(targetLookAt, 0.05);
                    
                    if (camera.position.distanceTo(targetCamPos) < 0.01) {
                        targetCamPos = null;
                    }
                }

                controls.update();
                renderer.render(scene, camera);
            }

                renderer.domElement.addEventListener('click', onPick);

            function onPick(e) {
                // ป้องกันไม่ให้คลิกซ้ำซ้อนในขณะที่กล้องกำลังซูมอยู่
                if (isZoomed) return;

                const r = renderer.domElement.getBoundingClientRect();
                const x = e.clientX - r.left;
                const y = e.clientY - r.top;

                pointer.x = (x / r.width) * 2 - 1;
                pointer.y = -(y / r.height) * 2 + 1;

                raycaster.setFromCamera(pointer, camera);
                const hit = raycaster.intersectObjects(pickables, true)[0];

                if (hit == null) return;

                const hitObject = hit.object;
                const hitPosition = new THREE.Vector3();
                hitObject.getWorldPosition(hitPosition);

                // เมื่อคลิกที่รูปภาพ Plane016
                if (hitObject === photoMesh) {
                    // 1. บันทึกตำแหน่งปัจจุบันของกล้องและ Target ไว้ก่อนซูม
                    originalCamPos.copy(camera.position);
                    originalCamTarget.copy(controls.target);

                    // 2. กำหนดตำแหน่งเป้าหมายที่จะให้กล้องวิ่งไปซูม
                    zoomCamTarget.copy(hitPosition);
                    zoomCamPos.set(
                        hitPosition.x + 7.0,
                        hitPosition.y,
                        hitPosition.z + 5.0
                    );

                    // 3. สั่งเคลื่อนที่กล้องและเปิดใช้งานสถานะซูม
                    targetLookAt.copy(zoomCamTarget);
                    targetCamPos = zoomCamPos;
                    isZoomed = true;

                    // แสดงปุ่มย้อนกลับ (Back)
                    document.getElementById("backBtn").style.display = "block";
                    console.log("คลิกที่รูปภาพ Plane016");
                }

                // นการทำงานของโคมไฟและทีวี
                if (hitObject === lampMesh) {
                    lampOn = !lampOn;
                    if (lampOn) {
                        lampLight.intensity = 8;
                        if (lampMesh && lampMesh.material.color) {
                            lampMesh.material.color.set(0xffff99);
                        }
                    } else {
                        lampLight.intensity = 0;
                        if (lampMesh && lampMesh.material.color) {
                            lampMesh.material.color.copy(originalLampColor);
                        }
                    }
                } 
                // การซูมเมื่อคลิกที่ทีวี (Plane018)
                else if (hitObject === tvMesh) {
                    originalCamPos.copy(camera.position);
                    originalCamTarget.copy(controls.target);

                    // กำหนดระยะซูมหน้าทีวี (สามารถปรับตัวเลข x, y, z เพิ่มลดได้ตามต้องการ)
                    zoomCamTarget.copy(hitPosition);
                    zoomCamPos.set(
                        hitPosition.x - 3.0,
                        hitPosition.y,
                        hitPosition.z + 4.0 // ปรับระยะความใกล้-ไกลตรงนี้
                    );

                    targetLookAt.copy(zoomCamTarget);
                    targetCamPos = zoomCamPos;
                    isZoomed = true;

                    document.getElementById("backBtn").style.display = "block";
                    console.log("คลิกที่ทีวี");
                }
            }
             // การทำงานของปุ่ม Back (ย้อนกลับ)
                document.getElementById("backBtn").addEventListener('click', () => {
                    if (isZoomed) {
                        targetLookAt.copy(originalCamTarget);
                        targetCamPos = originalCamPos; // ดีดกลับตำแหน่งเดิมที่จำไว้ ไม่ให้เพี้ยนแม้จะหมุนจอ
                        isZoomed = false;

                        document.getElementById("backBtn").style.display = "none";
                    }
                });
    

                requestAnimationFrame(animate);

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
    </script>
</body>

</html>
